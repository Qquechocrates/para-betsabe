<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Infinito para Betsabé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010105;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Pantalla de Entrada Toca para Iniciar */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #221800 0%, #05020a 60%, #000000 100%);
            z-index: 100;
            cursor: pointer;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .girasol-contenedor {
            width: 190px;
            height: 190px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.5) 0%, rgba(255, 100, 0, 0.15) 55%, transparent 75%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulsoMagico 2.2s infinite ease-in-out;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
        }

        .girasol-icon {
            font-size: 105px;
            filter: drop-shadow(0 0 25px #ffd700);
        }

        .texto-inicio {
            color: #ffffff;
            font-size: 26px;
            margin-top: 35px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 12px #ffd700, 0 0 25px #ffaa00;
            font-weight: 400;
        }

        @keyframes pulsoMagico {
            0% { transform: scale(0.92); opacity: 0.8; box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 90px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(0.92); opacity: 0.8; box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
        }

        /* Encabezado Principal */
        #titulo-header {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo-principal {
            color: #fffdf0;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff9900;
        }

        .nombre-betsabe {
            color: #ffd700;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 6px;
            margin-top: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px #ffd700, 0 0 35px #ff6600, 0 0 60px #ffcc00;
            animation: resplandorDorado 3s infinite alternate;
        }

        @keyframes resplandorDorado {
            from { filter: drop-shadow(0 0 3px #ffd700); }
            to { filter: drop-shadow(0 0 18px #ffae00); }
        }

        #webgl-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Pantalla de Entrada -->
    <div id="pantalla-inicio">
        <div class="girasol-contenedor">
            <span class="girasol-icon">🌻</span>
        </div>
        <div class="texto-inicio">Toca para iniciar</div>
    </div>

    <!-- Título Encabezado -->
    <div id="titulo-header">
        <span class="titulo-principal">Feliz día de las Flores Amarillas 🌻</span>
        <span class="nombre-betsabe">Betsabé</span>
    </div>

    <div id="webgl-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let galaxiaGrupo, centroGaláctico, anilloLuz, nebulosaGrupo;

        // Lista amplia de mensajes dedicados para una amiga especial
        const frasesAmistad = [
            "Para ti, Betsabé 🌻",
            "Siempre brillas ✨",
            "Eres súper especial 💛",
            "Luz en mi vida 🌟",
            "Sonríe siempre 😊",
            "Un detalle amarillo 🌼",
            "Atesoro tu amistad 💛",
            "Nunca apagues tu luz ✨",
            "Vales oro, Betsabé 💛",
            "Gracias por estar 🌸",
            "Tu alegría contagia ✨",
            "Una gran amiga 🌻",
            "Brillas como el Sol ☀️",
            "Un abrazo al alma 💛",
            "Siempre auténtica 🌟",
            "Tu luz ilumina todo ✨",
            "Flores para ti 🌻",
            "Amistad sincera 💛",
            "El universo celebra tu luz ✨",
            "Siempre brillas alto 🌟",
            "Contigo todo es mejor 🌼",
            "Universo de luz para ti ✨",
            "Sonrisa de oro 💛",
            "Increíble persona 🌻",
            "Que nunca te falten motivos para sonreír ✨"
        ];

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Escena y Niebla Profunda
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010105, 0.00035);

            // 2. Cámara de Gran Campo de Visión
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 260, 520);

            // 3. Renderizador WebGL con Mapeo de Tonos
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container.appendChild(renderer.domElement);

            // 4. Controles Interactivos
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.035;
            controls.maxDistance = 1400;
            controls.minDistance = 30;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.45;

            // 5. Iluminación Cósmica
            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(luzAmbiente);

            const luzSolCentral = new THREE.PointLight(0xffd700, 5, 1200);
            luzSolCentral.position.set(0, 0, 0);
            scene.add(luzSolCentral);

            // 6. Grupo Principal del Universo
            galaxiaGrupo = new THREE.Group();
            scene.add(galaxiaGrupo);

            // 7. Componentes del Universo
            crearCentroGalaxiaRealista();
            crearFondoEstrellasInfinito();
            crearNubesNebulosa();
            crearEspiralGalacticaGigante();

            window.addEventListener('resize', onWindowResize);
        }

        function crearCentroGalaxiaRealista() {
            // Sol Central / Agujero de Luz
            const geoSol = new THREE.SphereGeometry(30, 64, 64);
            const matSol = new THREE.MeshBasicMaterial({ color: 0xffffff });
            centroGaláctico = new THREE.Mesh(geoSol, matSol);
            galaxiaGrupo.add(centroGaláctico);

            // Corona Resplandeciente
            const geoAtm = new THREE.SphereGeometry(42, 32, 32);
            const matAtm = new THREE.MeshBasicMaterial({
                color: 0xffb700,
                transparent: true,
                opacity: 0.4,
                side: THREE.BackSide
            });
            galaxiaGrupo.add(new THREE.Mesh(geoAtm, matAtm));

            // Anillos de Acreción Amarillos
            const geoAnillo = new THREE.RingGeometry(45, 110, 128);
            const matAnillo = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.75
            });
            anilloLuz = new THREE.Mesh(geoAnillo, matAnillo);
            anilloLuz.rotation.x = Math.PI / 2;
            galaxiaGrupo.add(anilloLuz);
        }

        function crearFondoEstrellasInfinito() {
            const cantidad = 8000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(cantidad * 3);
            const col = new Float32Array(cantidad * 3);

            for (let i = 0; i < cantidad * 3; i += 3) {
                pos[i] = (Math.random() - 0.5) * 3200;
                pos[i + 1] = (Math.random() - 0.5) * 3200;
                pos[i + 2] = (Math.random() - 0.5) * 3200;

                const rand = Math.random();
                if (rand > 0.4) {
                    col[i] = 1.0; col[i + 1] = 0.88; col[i + 2] = 0.3; // Dorado/Amarillo
                } else if (rand > 0.2) {
                    col[i] = 0.7; col[i + 1] = 0.3; col[i + 2] = 0.9; // Púrpura
                } else {
                    col[i] = 0.3; col[i + 1] = 0.6; col[i + 2] = 1.0; // Azul espacial
                }
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const mat = new THREE.PointsMaterial({
                size: 2.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            scene.add(new THREE.Points(geo, mat));
        }

        function crearNubesNebulosa() {
            nebulosaGrupo = new THREE.Group();
            const numParticulas = 1200;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(numParticulas * 3);
            const col = new Float32Array(numParticulas * 3);

            for (let i = 0; i < numParticulas * 3; i += 3) {
                const radio = 80 + Math.random() * 450;
                const angulo = Math.random() * Math.PI * 2;
                pos[i] = radio * Math.cos(angulo);
                pos[i + 1] = (Math.random() - 0.5) * 70;
                pos[i + 2] = radio * Math.sin(angulo);

                // Tonos violeta y magenta realistas estilo galaxia
                col[i] = 0.8 + Math.random() * 0.2;
                col[i + 1] = 0.2 + Math.random() * 0.4;
                col[i + 2] = 0.9;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const mat = new THREE.PointsMaterial({
                size: 14,
                vertexColors: true,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending
            });

            nebulosaGrupo.add(new THREE.Points(geo, mat));
            galaxiaGrupo.add(nebulosaGrupo);
        }

        // Crear modelo 3D de Girasol estilizado realista
        function crearGirasol3D() {
            const florGrupo = new THREE.Group();

            // Centro del Girasol
            const geoCentro = new THREE.SphereGeometry(2.2, 16, 16);
            const matCentro = new THREE.MeshStandardMaterial({ 
                color: 0x3b1a00, 
                roughness: 0.6,
                emissive: 0x220e00
            });
            const centro = new THREE.Mesh(geoCentro, matCentro);
            centro.scale.set(1, 0.35, 1);
            florGrupo.add(centro);

            // Pétalos Amarillos Dorados en 3D
            const numPetalos = 16;
            const matPetalo = new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                roughness: 0.2,
                metalness: 0.1,
                emissive: 0x664400
            });

            for (let i = 0; i < numPetalos; i++) {
                const angulo = (i / numPetalos) * Math.PI * 2;
                const geoPetalo = new THREE.ConeGeometry(0.9, 5.5, 5);
                const petalo = new THREE.Mesh(geoPetalo, matPetalo);

                petalo.position.x = Math.cos(angulo) * 3.2;
                petalo.position.z = Math.sin(angulo) * 3.2;
                petalo.rotation.y = -angulo;
                petalo.rotation.z = Math.PI / 2;

                florGrupo.add(petalo);
            }

            florGrupo.scale.set(2.2, 2.2, 2.2);
            return florGrupo;
        }

        function crearTexto3DSprite(texto) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 140;

            ctx.font = 'Bold 36px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ffea00';
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 18;
            ctx.textAlign = 'center';
            ctx.fillText(texto, 300, 75);

            const textura = new THREE.CanvasTexture(canvas);
            const matSprite = new THREE.SpriteMaterial({ map: textura, transparent: true });
            const sprite = new THREE.Sprite(matSprite);
            sprite.scale.set(55, 13, 1);
            return sprite;
        }

        function crearEspiralGalacticaGigante() {
            const totalElementos = 550; // Gran densidad de elementos
            const brazos = 4; // 4 Brazos galácticos principales

            for (let i = 0; i < totalElementos; i++) {
                const radio = 70 + Math.random() * 460;
                const anguloGiro = radio * 0.012;
                const anguloBrazo = ((i % brazos) * (2 * Math.PI)) / brazos;
                const theta = anguloBrazo + anguloGiro + (Math.random() - 0.5) * 0.38;

                const x = radio * Math.cos(theta);
                const z = radio * Math.sin(theta);
                const y = (Math.random() - 0.5) * 55;

                // Distribución entre Flores 🌻 y Frases Bonitas
                if (Math.random() > 0.42) {
                    const flor = crearGirasol3D();
                    flor.position.set(x, y, z);
                    flor.rotation.x = Math.random() * Math.PI;
                    flor.rotation.y = Math.random() * Math.PI;
                    galaxiaGrupo.add(flor);
                } else {
                    const fraseRandom = frasesAmistad[Math.floor(Math.random() * frasesAmistad.length)];
                    const textoSprite = crearTexto3DSprite(fraseRandom);
                    textoSprite.position.set(x, y, z);
                    galaxiaGrupo.add(textoSprite);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotación dinámica de la galaxia completa
            if (galaxiaGrupo) {
                galaxiaGrupo.rotation.y += 0.001;
            }

            if (anilloLuz) {
                anilloLuz.rotation.z += 0.0018;
            }

            if (nebulosaGrupo) {
                nebulosaGrupo.rotation.y -= 0.0003;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Inicio interactivo al presionar la pantalla
        document.getElementById('pantalla-inicio').addEventListener('click', function() {
            const pantalla = this;
            pantalla.style.opacity = '0';
            
            setTimeout(() => {
                pantalla.style.display = 'none';
                document.getElementById('titulo-header').style.opacity = '1';
            }, 1800);

            init();
            animate();
        });
    </script>
</body>
</html>
